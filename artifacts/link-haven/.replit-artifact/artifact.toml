kind = "web"
previewPath = "/"
title = "Link Haven"
version = "1.0.0"
id = "artifacts/link-haven"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23116

[services.development]
run = "pnpm --filter @workspace/link-haven run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/link-haven", "run", "build" ]
publicDir = "artifacts/link-haven/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23116"
BASE_PATH = "/"
